name: Mantener Supabase activo
on:
  schedule:
    - cron: '0 8 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la base de datos
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: sb_publishable_V4zxj2459aETYhiP-IQACA_Hs4xI9a8" \
            "https://xnkuuigeukpfkfcpmrar.supabase.co/rest/v1/profiles?select=id&limit=1")
          echo "Respuesta: $code"
          if [ "$code" -ge 500 ] || [ "$code" -eq 0 ]; then exit 1; fi
